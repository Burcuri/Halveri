var _recaptchaVerifier = null;
var _confirmationResult = null;
var _pendingPhone = null;

function getRecaptchaVerifier(){
  if(!_recaptchaVerifier){
    _recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size:'invisible' });
  }
  return _recaptchaVerifier;
}

function resetRecaptchaVerifier(){
  if(_recaptchaVerifier){
    try{ _recaptchaVerifier.clear(); }catch(e){}
    _recaptchaVerifier = null;
  }
  var box = document.getElementById('recaptcha-container');
  if(box) box.innerHTML = '';
}

function getFullPhoneFromForm(){
  var t1=document.getElementById('tel1'), t2=document.getElementById('tel2'), t3=document.getElementById('tel3'), t4=document.getElementById('tel4');
  if(!t1||!t2||!t3||!t4) return null;
  var raw = ('05'+t1.value+t2.value+t3.value+t4.value).replace(/[^0-9]/g,'');
  if(raw.length < 10) return null;
  if(raw.charAt(0)==='0') raw = raw.substring(1);
  return '+90'+raw;
}

var SMS_SEND_NAV = {
  'f3b': function(){ goBuyer('f3b'); },
  'c5': function(){ goFarmer('c5'); },
  'n3': function(){ goNakliyeci('n3'); }
};
var SMS_VERIFY_NAV = {
  'f3c': function(){ goBuyer('f3c'); },
  'c6': function(){ goFarmer('c6'); },
  'n4': function(){ goNakliyeci('n4'); }
};

// Bu telefon numarasıyla zaten kayıtlı bir profil var mı diye bakar (yeniden kayıt
// yerine "Hesap zaten aktif / Şifremi Unuttum" akışına yönlendirmek için kullanılır).
// Bu kontrol kullanıcı henüz Firebase'e giriş yapmadan (SMS gönderilmeden) önce çalışır,
// bu yüzden profiles tablosuna doğrudan erişemez (RLS kilitli). Bunun yerine Supabase'de
// tanımlı check_phone_exists() adlı güvenli bir veritabanı fonksiyonunu (RPC) çağırır —
// bu fonksiyon sadece firebase_uid ve role döner, tam profili asla ifşa etmez.
function checkPhoneExists(phone){
  return supabaseClient.rpc('check_phone_exists', { p_phone: phone }).then(function(res){
    return (res && res.data) ? res.data : null;
  }).catch(function(){ return null; });
}
function sendSmsCode(destination, btn){
  var phone = getFullPhoneFromForm();
  if(!phone){ openErrorModal('Lütfen geçerli bir telefon numarası girin.'); return; }
  var originalText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Kontrol ediliyor...'; }
  checkPhoneExists(phone).then(function(existing){
    if(existing){
      if(btn){ btn.disabled = false; btn.textContent = originalText; }
      openAccountExistsPopup(phone);
      return;
    }
    if(btn){ btn.textContent = 'Gönderiliyor...'; }
    var verifier = getRecaptchaVerifier();
    fbAuth.signInWithPhoneNumber(phone, verifier).then(function(result){
      _confirmationResult = result;
      _pendingPhone = phone;
      if(btn){ btn.disabled = false; btn.textContent = originalText; }
      if(SMS_SEND_NAV[destination]) SMS_SEND_NAV[destination]();
    }).catch(function(err){
      if(btn){ btn.disabled = false; btn.textContent = originalText; }
      resetRecaptchaVerifier();
      openErrorModal('SMS gönderilemedi.<br>'+(err && err.message ? err.message : ''));
    });
  });
}

function telNextGeneric(el, nextId, max){
  el.value = el.value.replace(/[^0-9]/g,'');
  if(el.value.length >= max){
    var next = document.getElementById(nextId);
    if(next) next.focus();
  }
}
function submitForgotPasswordPhone(){
  var t1=document.getElementById('fpTel1'), t2=document.getElementById('fpTel2'),
      t3=document.getElementById('fpTel3'), t4=document.getElementById('fpTel4');
  if(!t1||!t2||!t3||!t4) return;
  var raw = ('05'+t1.value+t2.value+t3.value+t4.value).replace(/[^0-9]/g,'');
  if(raw.length < 10){
    openErrorModal('Lütfen telefon numaranızı eksiksiz girin.');
    return;
  }
  if(raw.charAt(0)==='0') raw = raw.substring(1);
  var phone = '+90'+raw;
  checkPhoneExists(phone).then(function(existing){
    if(!existing){
      openErrorModal('Bu numarayla kayıtlı bir hesap bulunamadı.<br>Numaranızı kontrol edin veya yeni bir hesap oluşturun.');
      return;
    }
    var ov = document.getElementById('forgotPwOv');
    if(ov) ov.remove();
    startPasswordReset(phone);
  });
}
function startPasswordReset(phone){
  if(!phone){ openErrorModal('Lütfen önce telefon numaranızı eksiksiz girin.'); return; }
  var ov = document.getElementById('acctExistsOv');
  if(ov) ov.remove();
  var verifier = getRecaptchaVerifier();
  fbAuth.signInWithPhoneNumber(phone, verifier).then(function(result){
    _confirmationResult = result;
    _pendingPhone = phone;
    go('pw_reset_verify');
  }).catch(function(err){
    resetRecaptchaVerifier();
    openErrorModal('SMS gönderilemedi.<br>'+(err && err.message ? err.message : ''));
  });
}
function verifyPasswordResetCode(btn){
  if(!_confirmationResult){ openErrorModal('Önce SMS kodu istemeniz gerekiyor.'); return; }
  var codeInput = document.getElementById('pwResetCode');
  var code = codeInput ? codeInput.value.trim() : '';
  if(code.length !== 6){
    if(codeInput){ codeInput.style.border='2px solid #C0000A'; codeInput.style.background='#FFF5F5'; }
    openErrorModal('Lütfen 6 haneli doğrulama kodunu girin.');
    return;
  }
  var originalText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Doğrulanıyor...'; }
  _confirmationResult.confirm(code).then(function(){
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
    _confirmationResult = null;
    go('pw_reset_new');
  }).catch(function(err){
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
    if(codeInput){ codeInput.style.border='2px solid #C0000A'; codeInput.style.background='#FFF5F5'; }
    openErrorModal('Kod hatalı veya süresi doldu. Lütfen tekrar deneyin.');
  });
}
function savePasswordReset(btn){
  var pw1 = document.getElementById('rpw1'), pw2 = document.getElementById('rpw2');
  var err = document.getElementById('rpwErr');
  if(!pw1 || !pw2 || pw1.value.length < 8 || pw1.value !== pw2.value){
    if(err) err.style.display = 'block';
    return;
  }
  if(err) err.style.display = 'none';
  var originalText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  fbAuth.currentUser.updatePassword(pw1.value).then(function(){
    saveRememberedPhone();
    return loadCurrentProfile();
  }).then(function(){
    isLoggedIn = true;
    if(currentProfile && currentProfile.role === 'nakliyeci'){ activeTab = 'nakliye_cagri'; goNakliyeci('home'); }
    else if(currentProfile && currentProfile.role === 'ciftci'){ activeTab = 'ilanlarim'; goBuyer('home'); }
    else { activeTab = 'pazar'; goBuyer('home'); }
  }).catch(function(err2){
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
    openErrorModal('Şifre güncellenemedi.<br>'+(err2 && err2.message ? err2.message : '')+'<br><br>Bu genelde güvenlik gereği yakın zamanda tekrar doğrulama ister — lütfen SMS adımından tekrar deneyin.');
  });
}

function resendSmsCode(linkEl){
  if(!_pendingPhone){ openErrorModal('Önce telefon numaranızı girin.'); return; }
  var original = linkEl ? linkEl.textContent : '';
  if(linkEl){ linkEl.textContent = 'Gönderiliyor...'; }
  resetRecaptchaVerifier();
  var verifier = getRecaptchaVerifier();
  fbAuth.signInWithPhoneNumber(_pendingPhone, verifier).then(function(result){
    _confirmationResult = result;
    if(linkEl){ linkEl.textContent = original; }
    openErrorModal('Yeni doğrulama kodu gönderildi.');
  }).catch(function(err){
    if(linkEl){ linkEl.textContent = original; }
    openErrorModal('Kod tekrar gönderilemedi.<br>'+(err && err.message ? err.message : ''));
  });
}

function verifySmsCode(destination, btn){
  if(!_confirmationResult){ openErrorModal('Önce SMS kodu istemeniz gerekiyor.'); return; }
  var codeInput = document.getElementById('smsCode');
  var code = codeInput ? codeInput.value.trim() : '';
  if(code.length !== 6){
    if(codeInput){ codeInput.style.border='2px solid #C0000A'; codeInput.style.background='#FFF5F5'; }
    openErrorModal('Lütfen 6 haneli doğrulama kodunu girin.');
    return;
  }
  var originalText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Doğrulanıyor...'; }
  _confirmationResult.confirm(code).then(function(){
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
    _confirmationResult = null;
    if(SMS_VERIFY_NAV[destination]) SMS_VERIFY_NAV[destination]();
  }).catch(function(err){
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
    if(codeInput){ codeInput.style.border='2px solid #C0000A'; codeInput.style.background='#FFF5F5'; }
    openErrorModal('Kod hatalı veya süresi doldu. Lütfen tekrar deneyin.');
  });
}
function phoneToEmail(phone){
  return phone.replace(/[^0-9]/g,'') + '@depom.app';
}

var _loginModeEmail = false;
function toggleLoginMode(){
  _loginModeEmail = !_loginModeEmail;
  var phoneBlock = document.getElementById('loginPhoneBlock');
  var emailBlock = document.getElementById('loginEmailBlock');
  var toggle = document.getElementById('loginModeToggle');
  var emailInput = document.getElementById('loginEmailInput');
  if(phoneBlock) phoneBlock.style.display = _loginModeEmail ? 'none' : 'block';
  if(emailBlock) emailBlock.style.display = _loginModeEmail ? 'block' : 'none';
  if(toggle) toggle.textContent = _loginModeEmail ? 'E-posta yerine telefon ile giriş yap' : 'Telefon yerine e-posta ile giriş yap';
  // Gizlenen bloktaki alanlar "zorunlu" kalmasın, aksi halde validateAndGo
  // görünmeyen boş alanlar yüzünden hatalı "Eksik Bilgi" uyarısı verir.
  ['tel1','tel2','tel3','tel4'].forEach(function(id){
    var el = document.getElementById(id);
    if(el){ if(_loginModeEmail){ el.removeAttribute('data-required'); } else { el.setAttribute('data-required','true'); } }
  });
  if(emailInput){ if(_loginModeEmail){ emailInput.setAttribute('data-required','true'); } else { emailInput.removeAttribute('data-required'); } }
}
function doPhonePasswordLogin(btn){
  var pwInput = document.getElementById('loginPw');
  var password = pwInput ? pwInput.value : '';
  var email;
  if(_loginModeEmail){
    var emailInput = document.getElementById('loginEmailInput');
    email = emailInput ? emailInput.value.trim() : '';
    if(!email){ openErrorModal('Lütfen e-posta adresinizi girin.'); return; }
  } else {
    var phone = getFullPhoneFromForm();
    if(!phone){ openErrorModal('Lütfen geçerli bir telefon numarası girin.'); return; }
    email = phoneToEmail(phone);
  }
  if(!password){ openErrorModal('Lütfen şifrenizi girin.'); return; }
  var originalText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Giriş yapılıyor...'; }
  fbAuth.signInWithEmailAndPassword(email, password).then(function(){
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
    var chk = document.getElementById('rememberMeChk');
    if(chk && chk.checked && !_loginModeEmail){ saveRememberedPhone(); } else { clearRememberedPhone(); }
    activeTab = 'pazar';
    isLoggedIn = true;
    loadCurrentProfile().then(function(){
      if(currentProfile && currentProfile.role === 'nakliyeci'){ activeTab = 'nakliye_cagri'; }
      goBuyer('home');
    });
  }).catch(function(err){
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
    if(err && (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential')){
      openErrorModal(_loginModeEmail ? 'E-posta veya şifre hatalı.' : 'Telefon numarası veya şifre hatalı.');
    } else {
      openErrorModal('Giriş yapılamadı.<br>'+(err && err.message ? err.message : ''));
    }
  });
}

function linkPasswordToAccount(password, destination, btn){
  var phone = _pendingPhone;
  if(!phone || !fbAuth.currentUser){
    openErrorModal('Hesap doğrulaması bulunamadı. Lütfen SMS adımını tekrar deneyin.');
    return;
  }
  var email = phoneToEmail(phone);
  var cred = firebase.auth.EmailAuthProvider.credential(email, password);
  var originalText = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  fbAuth.currentUser.linkWithCredential(cred).then(function(){
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
    if(NAV_AFTER_PASSWORD[destination]) NAV_AFTER_PASSWORD[destination]();
  }).catch(function(err){
    if(err && (err.code === 'auth/provider-already-linked' || err.code === 'auth/email-already-in-use' || err.code === 'auth/credential-already-in-use')){
      fbAuth.currentUser.updatePassword(password).then(function(){
        if(btn){ btn.disabled = false; btn.textContent = originalText; }
        if(NAV_AFTER_PASSWORD[destination]) NAV_AFTER_PASSWORD[destination]();
      }).catch(function(err2){
        if(btn){ btn.disabled = false; btn.textContent = originalText; }
        openErrorModal('Şifre kaydedilemedi.<br>'+(err2 && err2.message ? err2.message : ''));
      });
    } else {
      if(btn){ btn.disabled = false; btn.textContent = originalText; }
      openErrorModal('Şifre kaydedilemedi.<br>'+(err && err.message ? err.message : ''));
    }
  });
}

function uploadImageToSupabase(file, bucket, pathPrefix, onStart, onDone, onError){
  if(!file){ if(onError) onError('Dosya seçilmedi.'); return; }
  if(!file.type || file.type.indexOf('image/') !== 0){
    if(onError) onError('Lütfen bir resim dosyası seçin.');
    return;
  }
  var uid = (typeof fbAuth !== 'undefined' && fbAuth.currentUser) ? fbAuth.currentUser.uid : 'anon';
  var ext = (file.name && file.name.indexOf('.') > -1) ? file.name.split('.').pop() : 'jpg';
  var path = (pathPrefix || 'img') + '/' + uid + '_' + Date.now() + '.' + ext;
  if(onStart) onStart();
  supabaseClient.storage.from(bucket).upload(path, file, { upsert:true, contentType: file.type }).then(function(res){
    if(res.error){
      console.error('Supabase Storage yükleme hatası:', res.error);
      if(onError) onError('Fotoğraf yüklenemedi. Lütfen tekrar deneyin.');
      return;
    }
    var pub = supabaseClient.storage.from(bucket).getPublicUrl(path);
    var publicUrl = pub && pub.data ? pub.data.publicUrl : null;
    if(onDone) onDone(publicUrl);
  }).catch(function(err){
    console.error('Supabase Storage yükleme hatası:', err);
    if(onError) onError('Fotoğraf yüklenemedi. Lütfen tekrar deneyin.');
  });
}

function saveProfileToSupabase(role){
  var uid = (typeof fbAuth !== 'undefined' && fbAuth.currentUser) ? fbAuth.currentUser.uid : null;
  if(!uid) return;
  var payload = {
    firebase_uid: uid,
    role: role,
    telefon: _pendingPhone || null

  if(role === 'alici'){
    payload.ad = regData.buyerAd || null;
    payload.soyad = regData.buyerSoyad || null;
    payload.tc_no = regData.buyerTc || null;
    payload.isletme_adi = regData.buyerIsletmeAdi || null;
    payload.adres = regData.buyerAdres || null;
    payload.selfie_url = regData.selfieUrl || null;
    payload.logo_url = regData.logoUrl || null;
    payload.sabit_arac = regData.aracDurumu === 'sabit';
    if(regData.aracDurumu === 'sabit'){

      payload.plaka_no = null;
      payload.arac_modeli = null;
      payload.arac_kapasite = null;
      payload.arac_kapasite_ton = null;
      payload.arac_foto_url = null;
    }
  } else if(role === 'nakliyeci'){
    payload.ad = regData.nakliyeciAd || null;
    payload.soyad = regData.nakliyeciSoyad || null;
    payload.adres = regData.nakliyeciSehir ? (regData.nakliyeciSehir + (regData.nakliyeciTamAdres ? ' - '+regData.nakliyeciTamAdres : '')) : (regData.nakliyeciTamAdres || null);

    payload.lng = _selectedLng || null;

function openEmailInsteadOfSmsPopup(destination){

      '<div style="font-size:16px;font-weight:bold;color:#2C2C2A;margin-bottom:6px">E-posta ile Devam Et</div>' +
      '<div style="font-size:12px;color:#5F5E5A;margin-bottom:14px">SMS kodu alamıyorsanız, telefon doğrulaması yerine e-posta ve şifre ile hesabınızı oluşturabilirsiniz.</div>' +
      '<div style="font-size:12px;color:#5F5E5A;margin-bottom:5px;font-weight:bold"><span style="color:#C0000A;margin-right:3px">*</span>E-posta</div>' +

      '<input id="emailRegPw1" type="password" placeholder="••••••••" style="width:100%;font-size:16px;padding:11px;border:1.5px solid #B4B2A9;border-radius:8px;box-sizing:border-box;margin-bottom:12px">' +
      '<div style="font-size:12px;color:#5F5E5A;margin-bottom:5px;font-weight:bold"><span style="color:#C0000A;margin-right:3px">*</span>Şifre Tekrar</div>' +
      '<input id="emailRegPw2" type="password" placeholder="••••••••" style="width:100%;font-size:16px;padding:11px;border:1.5px solid #B4B2A9;border-radius:8px;box-sizing:border-box;margin-bottom:16px">' +
      '<button onclick="submitEmailInsteadOfSms(\''+destination+'\',this)" style="width:100%;padding:14px;border-radius:10px;background:#0C447C;color:#fff;font-size:15px;font-weight:bold;border:none;cursor:pointer;margin-bottom:8px">Kayıt Ol</button>' +
      '<button onclick="document.getElementById(\'emailRegOv\').remove()" style="width:100%;padding:12px;border:none;background:none;color:#B4B2A9;font-size:13px;cursor:pointer">Vazgeç</button>' +

function submitEmailInsteadOfSms(destination, btn){
  var email = (document.getElementById('emailRegEmail')||{}).value ? document.getElementById('emailRegEmail').value.trim() : '';
  var pw1 = (document.getElementById('emailRegPw1')||{}).value || '';
  var pw2 = (document.getElementById('emailRegPw2')||{}).value || '';
  if(!email || !pw1 || !pw2){ openErrorModal('Lütfen tüm alanları doldurun.'); return; }
  if(pw1 !== pw2){ openErrorModal('Girdiğiniz şifreler birbirini tutmuyor.'); return; }
  if(pw1.length < 8){ openErrorModal('Şifreniz en az 8 karakter olmalıdır.'); return; }
  if(!/[A-Z]/.test(pw1) && !/[!@#$%^&*?_\-+=.]/.test(pw1)){
    openErrorModal('Şifrenizde en az 1 büyük harf veya özel karakter (!, @, #, ?, * vb.) olmalıdır.');
    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  fbAuth.createUserWithEmailAndPassword(email, pw1).then(function(){
    var ov = document.getElementById('emailRegOv');
    if(ov) ov.remove();
    _pendingPhone = getFullPhoneFromForm(); // varsa girilen telefonu da sakla (opsiyonel)
    if(NAV_AFTER_PASSWORD[destination]) NAV_AFTER_PASSWORD[destination]();
  }).catch(function(err){
    if(btn){ btn.disabled = false; btn.textContent = 'Kayıt Ol'; }
    var msg = (err && err.code === 'auth/email-already-in-use') ? 'Bu e-posta zaten kullanılıyor.' :
              (err && err.code === 'auth/invalid-email') ? 'Geçersiz e-posta adresi.' :
              (err && err.message ? err.message : 'Bilinmeyen bir hata oluştu.');
    openErrorModal('Kayıt oluşturulamadı.<br>'+msg);
  });
}
// Sadece metin (type="text") alanlarında çalışır — telefon/TC/ÇKS/VKN gibi
// sayısal alanlar type="tel" kullandığı için bundan etkilenmez.
// Metin (type="text") kutularında ve çok satırlı (textarea) alanlarda çalışır —
// telefon/TC/ÇKS/VKN gibi sayısal alanlar type="tel" kullandığı için bundan etkilenmez.
document.addEventListener('input', function(e){
  var el = e.target;
  var isTextInput = el && el.tagName === 'INPUT' && el.type === 'text' && el.id !== 'smsCode';
  var isTextarea = el && el.tagName === 'TEXTAREA';
  if(isTextInput || isTextarea){
    var start = el.selectionStart, end = el.selectionEnd;
    var val = el.value;
    var newVal = val.replace(/(^|\s)([a-zçğıöşü])/g, function(m, p1, p2){
      return p1 + p2.toLocaleUpperCase('tr');
    });
    if(newVal !== val){
      el.value = newVal;
      el.setSelectionRange(start, end);
    }
  }
});

function syncPhoneUsername(){
  var sync = document.getElementById('phoneUsernameSync');
  if(!sync) return;
  var t1 = document.getElementById('tel1'), t2 = document.getElementById('tel2'),
      t3 = document.getElementById('tel3'), t4 = document.getElementById('tel4');
  sync.value = '05'+(t1?t1.value:'')+(t2?t2.value:'')+(t3?t3.value:'')+(t4?t4.value:'');
}
function telNext(el, nextId, max){
  el.value = el.value.replace(/[^0-9]/g,'');
  syncPhoneUsername();
  if(el.value.length >= max){
    var next = document.getElementById(nextId);
    if(next) next.focus();
  }
}
function telBack(e, el, prevId){
  if(e.key==='Backspace' && el.value===''){
    var prev = document.getElementById(prevId);
    if(prev){ prev.focus(); }
  }
}
function validatePhone(){
  var p1=document.getElementById('ph1');

  var full=(p1.value+p2.value+p3.value+p4.value);

    [p1,p2,p3,p4].forEach(function(p){ p.style.border='2px solid #C0000A'; p.style.background='#FFF5F5'; });

  return Promise.all([
    supabaseClient.from('karma_yukler').select('*, karma_yuk_kalemleri(*)').eq('durum','nakliye_bekliyor').order('created_at',{ascending:false}),

function submitTalipOl(karmaYukId, btn){
  var input = document.getElementById('talipOlKmFiyat');
  var kmFiyat = input ? input.value.trim() : '';
  if(!kmFiyat || isNaN(parseFloat(kmFiyat))){
    openErrorModal('Lütfen geçerli bir km fiyatı girin.');
    return;
  }
  var uid = (typeof fbAuth !== 'undefined' && fbAuth.currentUser) ? fbAuth.currentUser.uid : null;
  if(!uid){ openErrorModal('Teklif vermek için giriş yapmış olmanız gerekiyor.'); return; }
  if(btn){ btn.disabled = true; btn.textContent = 'Gönderiliyor...'; }
  supabaseClient.from('karma_yuk_teklifleri').insert({
    karma_yuk_id: karmaYukId,
    nakliyeci_uid: uid,
    km_fiyat: parseFloat(kmFiyat)
  }).then(function(res){
    var ov = document.getElementById('talipOlOv');
    if(res.error){
      if(btn){ btn.disabled = false; btn.textContent = 'Teklifi Gönder'; }
      openErrorModal('Teklif gönderilemedi.<br>'+res.error.message);
      return;
    }
    if(ov) ov.remove();
    _karmaYuklerLoaded = false; // listeyi tazele, "Teklifiniz: X TL/km" görünsün
    render(_currentScreenId || 'home');
  }).catch(function(err){
    if(btn){ btn.disabled = false; btn.textContent = 'Teklifi Gönder'; }
    openErrorModal('Teklif gönderilemedi.<br>'+(err && err.message ? err.message : ''));
  });
}

// dakikada bir tekrar dener, sinyal bulunca yeniden 20 dk'lık döngüye
// döner. ÖNEMLİ SINIR: Bu sadece uygulama ekranı AÇIKKEN çalışır —
// telefon kilitliyken veya sekme kapalıyken konum gönderilemez, bu
// yüzden nakliyeciye ekranda sürekli bir uyarı gösteriyoruz.
var _konumTakipTimer = null;
var _konumTakipKarmaYukId = null;

function konumUyariMetni(){
  return '<div style="font-size:11px;color:#C0000A;background:#FFF5F5;border:1px solid #C0000A;border-radius:8px;padding:10px;margin-bottom:10px;line-height:1.5">'+
    mi('warning',12,'#C0000A')+' Bu takip SADECE uygulama ekranı açıkken çalışır. Telefonunuz kilitliyken veya uygulama kapalıyken konum bilgisi çiftçilere ve alıcıya İLETİLMEZ. Lütfen yolculuk boyunca uygulamayı sık sık açıp kontrol edin.'+
  '</div>';
}
function startKonumTakip(karmaYukId){
  _konumTakipKarmaYukId = karmaYukId;
  raporlaKonum();
}
function raporlaKonum(){
  if(!navigator.geolocation || !_konumTakipKarmaYukId) return;
  navigator.geolocation.getCurrentPosition(function(pos){
    supabaseClient.rpc('update_karma_yuk_konum', {
      p_karma_yuk_id: _konumTakipKarmaYukId,
      p_lat: pos.coords.latitude,
      p_lng: pos.coords.longitude
    }).then(function(){});
    if(_konumTakipTimer) clearTimeout(_konumTakipTimer);
    _konumTakipTimer = setTimeout(raporlaKonum, 20*60*1000); // 20 dk sonra tekrar
  }, function(){
    // Sinyal alınamadı — 3 dk sonra tekrar dene.
    if(_konumTakipTimer) clearTimeout(_konumTakipTimer);
    _konumTakipTimer = setTimeout(raporlaKonum, 3*60*1000);
  }, { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
}
function stopKonumTakip(){
  if(_konumTakipTimer){ clearTimeout(_konumTakipTimer); _konumTakipTimer = null; }
  _konumTakipKarmaYukId = null;
}

// ---- Nakliyeci: kendi atandığı aktif teslimat ----
var myActiveKarmaYuk = [];
var _myActiveKarmaYukLoaded = false;
var _myActiveKarmaYukLoading = false;

function loadMyActiveKarmaYuk(){
  var uid = (typeof fbAuth !== 'undefined' && fbAuth.currentUser) ? fbAuth.currentUser.uid : null;
  if(!uid){ _myActiveKarmaYukLoaded = true; myActiveKarmaYuk = []; return Promise.resolve(); }
  _myActiveKarmaYukLoading = true;
  return supabaseClient.from('karma_yukler').select('*, karma_yuk_kalemleri(*)')
    .eq('nakliyeci_uid', uid).is('teslim_onay_zamani', null).order('created_at',{ascending:false}).then(function(res){
      _myActiveKarmaYukLoading = false;
      _myActiveKarmaYukLoaded = true;
      myActiveKarmaYuk = (!res.error && res.data) ? res.data : [];
      // Zaten yola çıkılmış ama henüz varılmamış bir teslimat varsa,
      // sayfa yeniden açıldığında konum takibini otomatik devam ettir.
      var devamEden = myActiveKarmaYuk.filter(function(ky){ return ky.yola_cikis_zamani && !ky.varis_zamani; })[0];
      if(devamEden && _konumTakipKarmaYukId !== devamEden.id){ startKonumTakip(devamEden.id); }
    }).catch(function(){
      _myActiveKarmaYukLoading = false;
      _myActiveKarmaYukLoaded = true;
      myActiveKarmaYuk = [];
    });
}

  } else if(!ky.varis_zamani){

      '<button onclick="nakliyeciVardi(\''+esc(ky.id)+'\')" style="width:100%;padding:12px;border-radius:10px;background:#1D9E75;color:#fff;font-size:14px;font-weight:bold;border:none;cursor:pointer">Vardım</button>';

function nakliyeciYolaCikti(karmaYukId){
  supabaseClient.rpc('mark_karma_yuk_yola_cikti', {p_karma_yuk_id: karmaYukId}).then(function(res){
    if(res.error || !res.data){ openErrorModal('İşlem başarısız oldu. Lütfen tekrar deneyin.'); return; }
    startKonumTakip(karmaYukId);
    _myActiveKarmaYukLoaded = false;
    render(_currentScreenId || 'home');
  }).catch(function(){ openErrorModal('İşlem başarısız oldu.'); });
}
function nakliyeciVardi(karmaYukId){
  supabaseClient.rpc('mark_karma_yuk_vardi', {p_karma_yuk_id: karmaYukId}).then(function(res){
    if(res.error || !res.data){ openErrorModal('İşlem başarısız oldu. Lütfen tekrar deneyin.'); return; }
    stopKonumTakip();
    _myActiveKarmaYukLoaded = false;
    render(_currentScreenId || 'home');
  }).catch(function(){ openErrorModal('İşlem başarısız oldu.'); });
}

// ---- Canlı konum haritası (alıcı ve çiftçi ortak kullanır) ----
function canliKonumHaritaHtml(ky, mapElId){
  if(!ky.guncel_lat || !ky.guncel_lng){
    return '<div style="font-size:12px;color:#B4B2A9;text-align:center;padding:14px;background:#F8F8F8;border-radius:10px;margin:8px 0">Henüz konum bilgisi paylaşılmadı.</div>';
  }
  return '<div id="'+mapElId+'" data-lat="'+esc(ky.guncel_lat)+'" data-lng="'+esc(ky.guncel_lng)+'" style="width:100%;height:180px;border-radius:12px;margin:8px 0;background:#e8f5e9"></div>'+
    '<div style="font-size:11px;color:#5F5E5A;text-align:center">Son konum: '+(ky.son_konum_zamani ? new Date(ky.son_konum_zamani).toLocaleString('tr-TR') : '—')+'</div>';
}
function initCanliKonumHaritalari(){
  document.querySelectorAll('[id^="canliKonumMap_"]').forEach(function(el){
    if(!window.L || el._mapInited) return;
    el._mapInited = true;
    var lat = parseFloat(el.getAttribute('data-lat')), lng = parseFloat(el.getAttribute('data-lng'));
    setTimeout(function(){
      var m = L.map(el.id, {zoomControl:false, dragging:false, scrollWheelZoom:false}).setView([lat,lng],12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(m);
      L.marker([lat,lng]).addTo(m);
    },100);
  });
}

// "100 TL/Kg" gibi bir metni sayı ve birime ayırır.
function parsePriceUnitValue(priceStr){
  var m = String(priceStr||'').match(/^([\d.,]+)\s*TL\s*\/\s*(.*)$/i);
  if(!m) return null;
  return { num: parseFloat(m[1].replace(',','.')), unit: (m[2]||'Ton').trim() };
}
// Bir ürün kaleminin toplam fiyatını hesaplar — miktar hep ton cinsinden
// tutulduğu için, fiyat kg üzerindense doğru çevrimi yapar.
function karmaYukItemTotal(miktarTon, birimFiyatStr){
  var p = parsePriceUnitValue(birimFiyatStr);
  if(!p || isNaN(p.num)) return 0;
  var unit = p.unit.toLowerCase();
  if(unit.indexOf('demet') === 0) return 0; // demet ton'a çevrilemez
  var qtyInPriceUnit = (unit.indexOf('kg') === 0) ? miktarTon*1000 : miktarTon;
  return qtyInPriceUnit * p.num;
}
function karmaYukBuyerCard(ky){
  var kalemler = ky.karma_yuk_kalemleri || [];
  var toplamFiyat = 0;
  var kalemlerHtml = kalemler.map(function(k){
    var miktar = parseFloat(k.miktar_ton)||0;
    var itemTotal = karmaYukItemTotal(miktar, k.birim_fiyat);
    toplamFiyat += itemTotal;
    var birimTonFiyat = miktar > 0 ? (itemTotal/miktar) : 0;
    return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #F2F2F2">'+
      '<span style="color:#2C2C2A">'+esc(k.urun_adi||'')+' <span style="color:#B4B2A9">('+esc(k.ciftlik_adi||'')+')</span></span>'+
      '<span style="font-weight:bold;color:#5F5E5A">'+esc(miktar)+' ton · '+birimTonFiyat.toFixed(2)+' TL/ton</span>'+
    '</div>';
  }).join('');
  var nakliyeNotu = ky.nakliyeci_uid ?
    ('<div style="font-size:11px;color:#3B6D11;margin-top:6px">'+mi('local_shipping',11,'#3B6D11',true)+' Nakliyeci atandı — '+esc(ky.km_fiyat)+' TL/km <span style="color:#888">(mesafeye göre nakliye ücreti teslimat aşamasında netleşir)</span></div>')
    : ('<div style="font-size:11px;color:#BA7517;margin-top:6px">'+mi('hourglass_top',11,'#BA7517')+' Henüz nakliyeci atanmadı</div>');
  return '<div style="border:1px solid #D3D1C7;border-radius:14px;padding:14px;margin-bottom:12px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'+
      '<div style="font-size:14px;font-weight:bold;color:#2C2C2A">'+mi('local_shipping',16,'#5C3408')+' Toplam '+esc(ky.toplam_ton)+' Ton</div>'+
      '<div style="font-size:15px;font-weight:bold;color:#0C447C">'+toplamFiyat.toFixed(2)+' TL</div>'+
    '</div>'+
    kalemlerHtml+
    nakliyeNotu+
    '<button onclick="openBuyerTalipOlPopup(\''+esc(ky.id)+'\')" style="width:100%;margin-top:10px;padding:11px;border-radius:10px;background:#0C447C;color:#fff;font-size:13px;font-weight:bold;border:none;cursor:pointer">Talip Ol</button>'+
  '</div>';
}
function openBuyerTalipOlPopup(karmaYukId){
  var ov = document.createElement('div');
  ov.id = 'buyerTalipOlOv';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10000;padding:16px';
  ov.onclick = function(e){ if(e.target === ov) ov.remove(); };
  ov.innerHTML =
    '<div style="background:#fff;border-radius:18px;padding:22px;max-width:300px;width:100%;box-sizing:border-box;text-align:center">' +
      '<div class="mi" style="font-size:40px;color:#0C447C;margin-bottom:10px">local_shipping</div>' +
      '<div style="font-size:16px;font-weight:bold;color:#2C2C2A;margin-bottom:8px">Bu karma yüke talip olmak istiyor musunuz?</div>' +
      '<div style="font-size:12px;color:#5F5E5A;margin-bottom:18px">Talip olduğunuzda bu yük size ayrılır, başka bir alıcı talip olamaz.</div>' +
      '<div style="display:flex;gap:10px">' +
        '<button onclick="document.getElementById(\'buyerTalipOlOv\').remove()" style="flex:1;padding:12px;border-radius:10px;background:#F2F2F2;color:#2C2C2A;font-size:14px;font-weight:bold;border:none;cursor:pointer">Vazgeç</button>' +
        '<button onclick="submitBuyerTalipOl(\''+esc(karmaYukId)+'\',this)" style="flex:1;padding:12px;border-radius:10px;background:#0C447C;color:#fff;font-size:14px;font-weight:bold;border:none;cursor:pointer">Talip Ol</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
}
function submitBuyerTalipOl(karmaYukId, btn){
  var uid = (typeof fbAuth !== 'undefined' && fbAuth.currentUser) ? fbAuth.currentUser.uid : null;
  if(!uid){ openErrorModal('Talip olmak için giriş yapmış olmanız gerekiyor.'); return; }
  if(btn){ btn.disabled = true; btn.textContent = 'Gönderiliyor...'; }
  supabaseClient.rpc('claim_karma_yuk_as_buyer', { p_karma_yuk_id: karmaYukId }).then(function(res){
    var ov = document.getElementById('buyerTalipOlOv');
    if(ov) ov.remove();
    if(res.error){ openErrorModal('Talip olunamadı.<br>'+res.error.message); return; }
    if(!res.data){
      openErrorModal('Üzgünüz, bu yüke sizden önce başka bir alıcı talip oldu.');
    } else {
      openErrorModal('Talip oldunuz! Nakliyeci atandığında bildirim alacaksınız.');
    }
    _karmaYuklerBuyerLoaded = false;
    render(_currentScreenId || 'home');
  }).catch(function(err){
    var ov = document.getElementById('buyerTalipOlOv');
    if(ov) ov.remove();
    openErrorModal('Talip olunamadı.<br>'+(err && err.message ? err.message : ''));
  });
}

// Nakliye Öner — alıcı/çiftçi tarafından bir nakliyecinin sisteme davet edilmesi.
// Not: Bu form şu an sadece bilgiyi topluyor; nakliyeciye SMS ile kullanıcı adı/geçici
// şifre gönderme işlemi gerçek bir sunucu (Firebase Admin SDK / Cloud Function) gerektirir,
// tarayıcı tarafından yapılamaz. Bu yüzden şimdilik sadece "öneri alındı" bilgisi veriyor.
function openSuggestNakliyeciSheet(){
  var ov = document.createElement('div');
  ov.id = 'suggestOv';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:999';
  ov.onclick = function(e){ if(e.target === ov) closeSuggestNakliyeciSheet(); };
  ov.innerHTML =
    '<div style="background:#fff;border-radius:18px 18px 0 0;padding:16px;width:100%;max-width:360px;box-sizing:border-box">' +
      '<div style="width:36px;height:4px;background:#D3D1C7;border-radius:2px;margin:0 auto 14px"></div>' +
      '<div style="font-size:15px;font-weight:bold;color:#2C2C2A;margin-bottom:14px">Nakliye Öner</div>' +
      fldPlain('İsim','Ad Soyad','suggestIsim') +
      fldPlain('Plaka','34 ABC 123','suggestPlaka') +
      fldPlain('Konum','Şehir','suggestKonum') +
      '<button onclick="submitSuggestNakliyeci()" style="width:100%;margin-top:6px;padding:14px;border-radius:12px;background:#5C3408;color:#fff;font-size:15px;font-weight:bold;border:none;cursor:pointer">Gönder</button>' +
      '<button onclick="closeSuggestNakliyeciSheet()" style="width:100%;margin-top:8px;padding:14px;border-radius:12px;background:#F2F2F2;color:#5F5E5A;font-size:15px;font-weight:bold;border:none;cursor:pointer">Vazgeç</button>' +
    '</div>';
  document.body.appendChild(ov);
}
function fldPlain(label, placeholder, id){
  return '<div style="margin-bottom:10px;text-align:left">' +
    '<div style="font-size:12px;color:#5F5E5A;margin-bottom:5px;font-weight:bold">'+label+'</div>' +
    '<input id="'+id+'" placeholder="'+placeholder+'" style="width:100%;font-size:16px;padding:11px;border:1.5px solid #B4B2A9;border-radius:8px;box-sizing:border-box">' +
  '</div>';
}
function closeSuggestNakliyeciSheet(){
  var ov = document.getElementById('suggestOv');
  if(ov) ov.remove();
}
function submitSuggestNakliyeci(){
  var isim = (document.getElementById('suggestIsim')||{}).value || '';
  closeSuggestNakliyeciSheet();
  if(!isim.trim()){ return; }
  openErrorModal(esc(isim)+' için nakliyeci önerisi alındı.<br><br>(Not: SMS ile giriş bilgisi gönderme özelliği için sunucu tarafı entegrasyonu gerekiyor.)');
}

// Hiçbir kullanıcı verisi (ad, adres, ikaz mesajı vb.) bundan geçmeden innerHTML'e yazılmaz.
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];

}

// Kullanıcının 4 bucket'ta da (ürün fotoğrafı, logo, selfie, araç fotoğrafı) yüklediği
// dosyaları bulup siler — sadece veritabanı satırını silmek dosyaları Storage'da "çöp"
// olarak bırakır, bu yüzden hesap kapatılırken bu adım da çalışmalı.
function deleteUserStorageFiles(uid){
  var targets = [
    {bucket: PRODUCT_BUCKET, folder:'product'},
    {bucket: LOGO_BUCKET, folder:'logo'},
    {bucket: SELFIE_BUCKET, folder:'selfie'},
    {bucket: VEHICLE_BUCKET, folder:'vehicle'}
  ];
  var hadError = false;
  var jobs = targets.map(function(t){
    return supabaseClient.storage.from(t.bucket).list(t.folder).then(function(res){
      if(res.error){ hadError = true; console.error('Storage listeleme hatası ('+t.bucket+'):', res.error); return; }
      if(!res.data) return;
      var matches = res.data
        .filter(function(f){ return f.name && f.name.indexOf(uid+'_') === 0; })
        .map(function(f){ return t.folder+'/'+f.name; });
      if(matches.length){
        return supabaseClient.storage.from(t.bucket).remove(matches).then(function(rres){
          if(rres && rres.error){ hadError = true; console.error('Storage silme hatası ('+t.bucket+'):', rres.error); }
        });
      }
    }).catch(function(e){ hadError = true; console.error('Storage hatası ('+t.bucket+'):', e); });
  });
  return Promise.all(jobs).then(function(){ if(hadError) throw new Error('storage-delete-failed'); });
}

function closeAccountConfirmed(btn){
  if(btn){ btn.disabled = true; btn.textContent = 'Kapatılıyor...'; }
  var uid = (typeof fbAuth !== 'undefined' && fbAuth.currentUser) ? fbAuth.currentUser.uid : null;
  var ov = document.getElementById('closeAccountOv');
  if(!uid){
    if(ov) ov.remove();
    resetLocalStateAfterAccountDeletion();
    go('welcome');
    return;
  }
  var storageFailed = false, productsFailed = false, profileFailed = false;
  deleteUserStorageFiles(uid).catch(function(e){ storageFailed = true; console.error('Storage silme hatası:', e); })
    .then(function(){
      return supabaseClient.from('products').delete().eq('firebase_uid', uid).then(function(res){
        if(res && res.error){ productsFailed = true; console.error('Ürün silme hatası:', res.error); }
      }).catch(function(e){ productsFailed = true; console.error('Ürün silme hatası:', e); });
    })
    .then(function(){
      return supabaseClient.from('profiles').delete().eq('firebase_uid', uid).then(function(res){
        if(res && res.error){ profileFailed = true; console.error('Profil silme hatası:', res.error); }
      }).catch(function(e){ profileFailed = true; console.error('Profil silme hatası:', e); });
    })
    .then(function(){ return fbAuth.currentUser.delete(); })
    .then(function(){
      if(ov) ov.remove();
      resetLocalStateAfterAccountDeletion();
      go('welcome');
      if(storageFailed || productsFailed || profileFailed){
        var parts = [];
        if(profileFailed) parts.push('profil bilgileriniz');
        if(productsFailed) parts.push('ürün ilanlarınız');
        if(storageFailed) parts.push('yüklediğiniz fotoğraflar');
        openErrorModal('Hesabınız kapatıldı, ancak '+parts.join(', ')+' veritabanından silinemedi.<br><br>Bu genellikle Supabase\'deki Row Level Security (RLS) ayarlarının DELETE işlemine izin vermemesinden kaynaklanır — profiles/products tablolarında ve storage bucket\'larında DELETE izni veren bir politika eklemeniz gerekir.<br><br>Kalan verileri admin panelindeki "Sahipsiz Kalıntıları Topluca Temizle" ile daha sonra silebilirsiniz.');
      }
    })
    .catch(function(err){
      if(ov) ov.remove();
      resetLocalStateAfterAccountDeletion();
      var msg = (err && err.code === 'auth/requires-recent-login') ?
        'Hesap verileriniz silindi. Hesabı tamamen kapatmak için lütfen tekrar giriş yapıp bu işlemi bir kez daha onaylayın.' :
        'Hesap verileriniz silindi.';
      fbAuth.signOut().then(function(){ go('welcome'); openErrorModal(msg); }).catch(function(){ go('welcome'); openErrorModal(msg); });
    });
}

// Not: Şifreyi biz saklamıyoruz — o tarayıcının kendi şifre yöneticisine bırakılır.
// Biz sadece telefon numarasını localStorage'da tutuyoruz, çünkü 4 parçalı
// kutu tasarımı yüzünden tarayıcı otomatik doldurma bunu güvenilir yapamıyor.
function saveRememberedPhone(){
  var t1=document.getElementById('tel1'), t2=document.getElementById('tel2'), t3=document.getElementById('tel3'), t4=document.getElementById('tel4');
  if(t1 && t2 && t3 && t4){
    localStorage.setItem('depom_remembered_phone', t1.value+'-'+t2.value+'-'+t3.value+'-'+t4.value);
  }
}
function clearRememberedPhone(){
  localStorage.removeItem('depom_remembered_phone');
}
function prefillRememberedPhone(){
  var saved = localStorage.getItem('depom_remembered_phone');
  if(!saved) return;
  var parts = saved.split('-');
  var t1=document.getElementById('tel1'), t2=document.getElementById('tel2'), t3=document.getElementById('tel3'), t4=document.getElementById('tel4');
  if(t1 && parts[0]) t1.value = parts[0];
  if(t2 && parts[1]) t2.value = parts[1];
  if(t3 && parts[2]) t3.value = parts[2];
  if(t4 && parts[3]) t4.value = parts[3];
  var chk = document.getElementById('rememberMeChk');
  if(chk) chk.checked = true;
}

function checkAccountStatusNotification(){

    ensureNotification('account_rejected', 'Hesap bilgilerinizi düzeltiniz! Yapılan incelemede hesap bilgileriniz doğrulanamadı.', "switchTab('hesabim')");
  }
  if(currentProfile && currentProfile.ikaz_mesaji){
    ensureNotification('admin_ikaz_'+currentProfile.ikaz_mesaji.slice(0,24), 'Yönetici uyarısı: '+currentProfile.ikaz_mesaji, "switchTab('hesabim')");
  }
}
function checkNewRequestNotifications(){
  productRequests.forEach(function(r){
    if(r.status === 'pending'){
      ensureNotification('call_'+r.id, r.productName+' için çağrı var', "switchTab('ilanlarim')");
    }
  });
}
function checkDeliveryCountdowns(){
  var now = Date.now();
  productRequests.forEach(function(r){
    if(r.status === 'approved' && r.approvedDate){
      var days = Math.ceil((new Date(r.approvedDate).getTime() - now) / (24*60*60*1000));
      if(days <= 1 && days >= 0){
        ensureNotification('delivery_'+r.id, r.productName+': Onaylanmış teslimat tarihine son '+(days<=0?'gün':days+' gün'), "go('my_products')");
      }
    }
  });
}
function ensureNotification(id, text, onclickAction){
  var exists = notifications.filter(function(n){ return n.id === id; })[0];
  if(exists) return;
  notifications.unshift({id:id, text:text, read:false, date:Date.now(), action:onclickAction});
}

function renderMyProducts(){
  if(!_myProductsLoaded){
    if(!_myProductsLoading){
      loadMyProducts().then(function(){ if(_currentScreenId === 'my_products') render('my_products'); });
    }
    return '<div style="text-align:center;padding:40px 16px;color:#B4B2A9">' +
      '<div class="mi" style="font-size:32px;color:#B4B2A9">refresh</div>' +
      '<div style="font-size:13px;margin-top:8px">Yükleniyor...</div>' +
    '</div>';
  }
  var role = (currentProfile && currentProfile.role) || 'alici';
  var baslik = role === 'ciftci' ? 'Sattığım Ürünler' : 'Aradığım Ürünler';
  var html = '';

  if(role === 'ciftci'){
    var pendingReqs = productRequests.filter(function(r){ return r.status === 'pending'; });
    if(pendingReqs.length){
      html += '<div style="font-size:13px;color:#C0000A;font-weight:bold;margin-bottom:10px">Onay Bekleyen Talep</div>';
      pendingReqs.forEach(function(r){ html += requestCard(r); });

    if(responded.length){
      html += '<div style="font-size:13px;color:#0C447C;font-weight:bold;margin-bottom:10px">Ürün Talebinize Cevap Var</div>';
      responded.forEach(function(r){ html += requestCard(r); });
      html += '<div style="border-top:1.5px dashed #D3D1C7;margin:6px 0 16px"></div>';
    }
  }

  html += '<div style="font-size:13px;color:#5F5E5A;margin-bottom:12px;font-weight:bold">'+baslik+'</div>';
  if(!myProducts.length){
    html += '<div style="text-align:center;padding:30px 16px;color:#B4B2A9">' +

function submitNewProduct(btn){
  var nameEl = document.getElementById('newProdName');
  var qtyNumEl = document.getElementById('newProdQtyNum');
  var qtyUnitEl = document.getElementById('newProdQtyUnit');
  var priceEl = document.getElementById('newProdPrice');
  var priceUnitEl = document.getElementById('newProdPriceUnit');
  var yukBirlestirmeEl = document.getElementById('newProdYukBirlestirme');
  var name = nameEl ? nameEl.value.trim() : '';
  var qtyNum = qtyNumEl ? qtyNumEl.value.trim() : '';
  var qtyUnit = qtyUnitEl ? qtyUnitEl.value : 'Ton';
  var priceNum = priceEl ? priceEl.value.trim() : '';
  var priceUnit = priceUnitEl ? priceUnitEl.value : qtyUnit;
  var yukBirlestirme = yukBirlestirmeEl ? !!yukBirlestirmeEl.checked : false;
  if(!name || !qtyNum || !priceNum){
    openErrorModal('Lütfen ürün adı, miktar ve fiyatı eksiksiz girin.');
    return;
  }
  var qty = qtyNum+' '+qtyUnit;
  var price = priceNum+' TL/'+priceUnit;
  var uid = (typeof fbAuth !== 'undefined' && fbAuth.currentUser) ? fbAuth.currentUser.uid : null;
  if(!uid){ openErrorModal('Ürün eklemek için giriş yapmış olmanız gerekiyor.'); return; }
  var p = currentProfile || {};
  var row = {
    firebase_uid: uid,
    name: name,
    qty: qty,
    price: price,
    photo_url: null,
    farm_name: p.isletme_adi || ((p.ad||'')+' '+(p.soyad||'')).trim() || 'Çiftlik',
    city: p.adres || null,
    yuk_birlestirmeye_uygun: yukBirlestirme
  };
  if(btn){ btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  supabaseClient.from('products').insert(row).then(function(res){
    var ov = document.getElementById('addProductOv');
    if(res.error){
      if(btn){ btn.disabled = false; btn.textContent = 'Kaydet'; }
      openErrorModal('Ürün kaydedilemedi.<br>'+res.error.message);
      return;
    }
    if(ov) ov.remove();
    _myProductsLoaded = false; // listeyi Supabase'den tazele
    render(_currentScreenId || 'home');
  }).catch(function(err){
    if(btn){ btn.disabled = false; btn.textContent = 'Kaydet'; }
    openErrorModal('Ürün kaydedilemedi.<br>'+(err && err.message ? err.message : ''));
  });
}

// ================== İLANI DÜZENLE (ad / miktar / fiyat) ==================
// "5 Ton" gibi bir metni sayı ve birime ayırır — form alanlarını doldurmak için.
function parseQtyString(s){
  var m = String(s||'').match(/^([\d.,]+)\s*(.*)$/);
  return m ? {num:m[1], unit:(m[2]||'Ton').trim()} : {num:'', unit:'Ton'};
}
// "100 TL/Kg" gibi bir metni sayı ve birime ayırır.
function parsePriceString(s){
  var m = String(s||'').match(/^([\d.,]+)\s*TL\s*\/\s*(.*)$/i);
  return m ? {num:m[1], unit:(m[2]||'Ton').trim()} : {num:'', unit:'Ton'};
}

function submitEditProduct(id, btn){
  var nameEl = document.getElementById('editProdName');
  var qtyNumEl = document.getElementById('editProdQtyNum');
  var qtyUnitEl = document.getElementById('editProdQtyUnit');
  var priceEl = document.getElementById('editProdPrice');
  var priceUnitEl = document.getElementById('editProdPriceUnit');
  var yukBirlestirmeEl = document.getElementById('editProdYukBirlestirme');
  var name = nameEl ? nameEl.value.trim() : '';
  var qtyNum = qtyNumEl ? qtyNumEl.value.trim() : '';
  var qtyUnit = qtyUnitEl ? qtyUnitEl.value : 'Ton';
  var priceNum = priceEl ? priceEl.value.trim() : '';
  var priceUnit = priceUnitEl ? priceUnitEl.value : qtyUnit;
  var yukBirlestirme = yukBirlestirmeEl ? !!yukBirlestirmeEl.checked : false;
  if(!name || !qtyNum || !priceNum){
    openErrorModal('Lütfen ürün adı, miktar ve fiyatı eksiksiz girin.');
    return;
  }
  var qty = qtyNum+' '+qtyUnit;
  var price = priceNum+' TL/'+priceUnit;
  if(btn){ btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  supabaseClient.from('products').update({name:name, qty:qty, price:price, yuk_birlestirmeye_uygun:yukBirlestirme}).eq('id', id).then(function(res){
    var ov = document.getElementById('editProductOv');
    if(res.error){
      if(btn){ btn.disabled = false; btn.textContent = 'Kaydet'; }
      openErrorModal('İlan güncellenemedi.<br>'+res.error.message);
      return;
    }
    if(ov) ov.remove();
    _myProductsLoaded = false;
    render(_currentScreenId || 'home');
  }).catch(function(err){
    if(btn){ btn.disabled = false; btn.textContent = 'Kaydet'; }
    openErrorModal('İlan güncellenemedi.<br>'+(err && err.message ? err.message : ''));
  });
}

// Başkasının yayınladığı ürün fotoğrafına tıklandığında bunun yerine
// openListingPreview() çağrılır — o sadece görüntüleme amaçlıdır, düzenleme seçeneği içermez.
// "ctx": fotoğraf değiştikten sonra hangi ekranın tazeleneceğini belirtir ('clogo' veya 'home').
function openPhotoActionSheet(kind, id, ctx){
  closePhotoActionSheet();
  ctx = ctx || '';
  var hasPhoto = false;
  if(kind === 'product'){ hasPhoto = !!((myProducts.filter(function(p){ return p.id === id; })[0] || {}).photo); }
  else if(kind === 'logo'){ hasPhoto = ctx === 'editprofile' ? !!(currentProfile && currentProfile.logo_url) : !!regData.logoUrl; }
  else if(kind === 'selfie'){ hasPhoto = !!regData.selfieUrl; }
  else if(kind === 'vehicle'){ hasPhoto = ctx === 'editprofile' ? !!(currentProfile && currentProfile.arac_foto_url) : !!regData.aracFotoUrl; }
  var ov = document.createElement('div');
  ov.id = 'photoSheetOv';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:999';
  ov.onclick = function(e){ if(e.target === ov) closePhotoActionSheet(); };
  var rows =
    sheetBtn('photo_camera', hasPhoto ? 'Yeniden Çek' : 'Resim Çek', "triggerPhotoCapture('"+kind+"','"+(id||'')+"','camera','"+ctx+"')") +
    sheetBtn('image','Albümden Yükle', "triggerPhotoCapture('"+kind+"','"+(id||'')+"','album','"+ctx+"')");
  if(hasPhoto){
    rows += sheetBtn('delete','Sil', "deletePhotoAction('"+kind+"','"+(id||'')+"','"+ctx+"')", '#C0000A');
  }
  ov.innerHTML =
    '<div style="background:#fff;border-radius:18px 18px 0 0;padding:10px 16px 24px;width:100%;max-width:360px">' +
      '<div style="width:36px;height:4px;background:#D3D1C7;border-radius:2px;margin:6px auto 14px"></div>' +
      rows +
      '<button onclick="closePhotoActionSheet()" style="width:100%;margin-top:6px;padding:14px;border-radius:12px;background:#F2F2F2;color:#5F5E5A;font-size:15px;font-weight:bold;border:none;cursor:pointer">Vazgeç</button>' +
    '</div>';
  document.body.appendChild(ov);
}

}

function closePhotoActionSheet(){
  var ov = document.getElementById('photoSheetOv');
  if(ov) ov.remove();
}

function triggerPhotoCapture(kind, id, mode, ctx){
  closePhotoActionSheet();
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  if(mode === 'camera'){ input.setAttribute('capture', kind === 'selfie' ? 'user' : 'environment'); }
  input.style.display = 'none';
  input.onchange = function(){
    if(input.files && input.files[0]){
      var file = input.files[0];
      var reader = new FileReader();
      reader.onload = function(e){ applyPhoto(kind, id, e.target.result, file, ctx); };
      reader.readAsDataURL(file);
    }
    if(input.parentNode) input.parentNode.removeChild(input);
  };
  document.body.appendChild(input);
  input.click();
}

function applyPhoto(kind, id, dataUrl, file, ctx){
  if(kind === 'product'){
    var prod = myProducts.filter(function(p){ return p.id === id; })[0];
    if(prod){ prod.photo = dataUrl; } // önizlemeyi hemen göster
    render('my_products');
    uploadImageToSupabase(file, PRODUCT_BUCKET, 'product',
      function(){},
      function(publicUrl){
        if(prod){ prod.photo = publicUrl; }
        supabaseClient.from('products').update({photo_url: publicUrl}).eq('id', id).then(function(res){
          if(res.error){ openErrorModal('Fotoğraf veritabanına kaydedilemedi.<br>'+res.error.message); }
          render('my_products');
        });
      },
      function(errMsg){
        if(prod){ prod.photo = null; }
        openErrorModal('Fotoğraf yüklenemedi.<br>'+errMsg+'<br><br>Bu genellikle Supabase Storage bucket izinlerinin eksik olmasından kaynaklanır.');
        render('my_products');
      }
    );
  } else if(kind === 'logo'){
    if(ctx === 'clogo' || ctx === 'f2b'){ refreshLogoBox('Yükleniyor...', '#888', dataUrl); }
    uploadImageToSupabase(file, LOGO_BUCKET, 'logo',
      function(){},
      function(publicUrl){
        regData.logoUrl = publicUrl;
        if(ctx === 'clogo' || ctx === 'f2b'){ refreshLogoBox(mi('check_circle',11,'#3B6D11',true)+' Yüklendi', '#3B6D11', publicUrl); }
        else if(ctx === 'editprofile'){
          currentProfile.logo_url = publicUrl;
          var uidL = currentProfile.firebase_uid;
          if(uidL){ supabaseClient.from('profiles').update({logo_url: publicUrl}).eq('firebase_uid', uidL).then(function(){}); }
          render('edit_profile');
        }
        else { render('home'); }
      },
      function(errMsg){
        if(ctx === 'clogo' || ctx === 'f2b'){ refreshLogoBox(mi('warning',11,'#C0000A')+' '+errMsg, '#C0000A', dataUrl); }
        else { render('home'); }
      }
    );
  } else if(kind === 'selfie'){
    regData.selfieUrl = dataUrl; // önizlemeyi hemen göster
    render('home');
    uploadImageToSupabase(file, SELFIE_BUCKET, 'selfie',
      function(){},
      function(publicUrl){ regData.selfieUrl = publicUrl; render('home'); },
      function(){ /* yükleme başarısız olsa da yerel önizleme ekranda kalır */ }
    );
  } else if(kind === 'vehicle'){
    if(ctx === 'n7' || ctx === 'carac'){ refreshVehicleBox(); }
    uploadImageToSupabase(file, VEHICLE_BUCKET, 'vehicle',
      function(){},
      function(publicUrl){
        regData.aracFotoUrl = publicUrl;
        if(ctx === 'n7' || ctx === 'carac'){ refreshVehicleBox(); }
        else if(ctx === 'editprofile'){
          currentProfile.arac_foto_url = publicUrl;
          var uidV = currentProfile.firebase_uid;
          if(uidV){ supabaseClient.from('profiles').update({arac_foto_url: publicUrl}).eq('firebase_uid', uidV).then(function(){}); }
          render('edit_profile');
        }
        else { render('home'); }
      },
      function(){ if(ctx !== 'n7' && ctx !== 'carac' && ctx !== 'editprofile'){ render('home'); } }
    );
  }
}

function deletePhotoAction(kind, id, ctx){
  closePhotoActionSheet();
  if(kind === 'product'){
    var prod = myProducts.filter(function(p){ return p.id === id; })[0];
    if(prod){ prod.photo = null; }
    render('my_products');
    supabaseClient.from('products').update({photo_url: null}).eq('id', id).then(function(){ render('my_products'); });
  } else if(kind === 'logo'){
    regData.logoUrl = null;
    if(ctx === 'clogo' || ctx === 'f2b'){ refreshLogoBox('', '#888', null); }
    else { render('home'); }
  } else if(kind === 'selfie'){
    regData.selfieUrl = null;
    render('home');
  } else if(kind === 'vehicle'){
    regData.aracFotoUrl = null;
    if(ctx === 'n7' || ctx === 'carac'){ refreshVehicleBox(); }
    else if(ctx === 'editprofile'){
      currentProfile.arac_foto_url = null;
      var uidD = currentProfile.firebase_uid;
      if(uidD){ supabaseClient.from('profiles').update({arac_foto_url: null}).eq('firebase_uid', uidD).then(function(){}); }
      render('edit_profile');
    }
    else { render('home'); }
  }
}

// ================== GENİŞ EKRAN (laptop) DEKORATİF ARKA PLAN ==================
// Uygulama 360px'lik dar bir sütunda ortalanıyor; laptopta yanlarda kalan
// boş beyaz alanı hafif, rastgele döndürülmüş ikonlarla süslüyoruz.
// Telefonda görünmüyor çünkü zaten yan boşluk kalmıyor.
var BG_DECOR_ICONS = ['agriculture','nutrition','eco','grass','cottage','local_shipping','package_2','warehouse','inventory','hand_package'];
function addBgDecor(){
  if(document.getElementById('bgDecor')) return;
  var wrap = document.createElement('div');
  wrap.id = 'bgDecor';
  wrap.style.cssText = 'position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none';

  var colors = ['#0C447C','#3B6D11','#1D9E75'];
  var sizePattern = [26,42,30,50,34,24]; // büyüklü küçüklü düzenli ritim
  var offsets = [45,150,270,400]; // sütun kenarından başlayıp dışa doğru daha fazla sütun, boşluğu daha iyi doldursun
  var gapY = 130; // dikey aralık, düzenli
  var html = '';

  ['left','right'].forEach(function(side){
    offsets.forEach(function(dist, colIdx){
      var xExpr = side==='left' ? ('calc(50% - 180px - '+dist+'px)') : ('calc(50% + 180px + '+dist+'px)');
      var y = 50;
      var i = colIdx; // her sıra farklı noktadan başlasın, düzeni bozmadan çeşitlensin
      while(y < 1400){
        var name = BG_DECOR_ICONS[i % BG_DECOR_ICONS.length];
        var size = sizePattern[i % sizePattern.length];
        var color = colors[i % colors.length];
        html += '<span class="mi" style="position:absolute;left:'+xExpr+';top:'+y+'px;font-size:'+size+'px;color:'+color+';opacity:.1;transform:translate(-50%,-50%)">'+name+'</span>';
        y += gapY;
        i++;
      }
    });
  });

  wrap.innerHTML = html;
  document.body.insertBefore(wrap, document.body.firstChild);
}

function openCamera(){
  var video = document.getElementById('camVideo');
  var canvas = document.getElementById('camCanvas');
  var placeholder = document.getElementById('camPlaceholder');
  var btn = document.getElementById('camBtn');
  if(!video) return;

  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(function(stream){
        window._camStream = stream;
        video.srcObject = stream;
        video.style.display = 'block';
        if(placeholder) placeholder.style.display = 'none';
        if(canvas) canvas.style.display = 'none';
        btn.innerHTML = mi('photo_camera',16,'#fff')+' Çek';
        btn.setAttribute('onclick','capturePhoto()');
      })
      .catch(function(err){
        openErrorModal('Kameraya erişilemedi. Tarayıcı izinlerini kontrol edin.');
      });
  } else {
    openErrorModal('Bu tarayıcı kamera erişimini desteklemiyor.');
  }
}

function capturePhoto(){
  var video = document.getElementById('camVideo');
  var canvas = document.getElementById('camCanvas');
  var btn = document.getElementById('camBtn');
  if(!video || !canvas) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  var ctx = canvas.getContext('2d');
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  // Bu fotoğrafı hesabın kimlik/profil fotoğrafı olarak sakla (logon yoksa Hesabım'da bu görünür)
  regData.selfieUrl = canvas.toDataURL('image/jpeg', 0.85);
  canvas.toBlob(function(blob){
    if(blob){
      uploadImageToSupabase(blob, SELFIE_BUCKET, 'selfie', function(){},
        function(publicUrl){ regData.selfieUrl = publicUrl; },
        function(){ /* yükleme başarısız olsa da yerel önizleme kalır */ });
    }
  }, 'image/jpeg', 0.85);

  video.style.display = 'none';
  canvas.style.display = 'block';

  if(window._camStream){
    window._camStream.getTracks().forEach(function(t){ t.stop(); });
  }

  btn.innerHTML = mi('refresh',16,'#fff')+' Tekrar çek';
  btn.setAttribute('onclick','openCamera()');
}

var _map = null;
var _mapMarker = null;
var _selectedLat = null;
var _selectedLng = null;

function findMyLocation(){
  if(!navigator.geolocation){ openErrorModal('Tarayıcınız konum desteklemiyor.'); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat = pos.coords.latitude;
    var lng = pos.coords.longitude;
    _selectedLat = lat.toFixed(5);
    _selectedLng = lng.toFixed(5);
    if(_map){
      _map.setView([lat,lng],15);
      if(_mapMarker){ _map.removeLayer(_mapMarker); }
      _mapMarker = L.marker([lat,lng]).addTo(_map);
      _mapMarker.bindPopup('Konumunuz burada').openPopup();
    }
    var cb = document.getElementById('coordBox');
    if(cb) cb.innerHTML = mi('location_on',12,'#3B6D11')+' '+_selectedLat+', '+_selectedLng;
    showNavLink(lat,lng);
  }, function(){ openErrorModal('Konum alınamadı. Lütfen tarayıcı izinlerini kontrol edin.'); });
}

function showNavLink(lat,lng){
  var box = document.getElementById('navLinkBox');
  if(!box) return;
  var url = 'https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng+'&travelmode=driving';
  box.innerHTML = '<a href="'+url+'" target="_blank" style="display:block;padding:12px;border-radius:10px;background:#0C447C;color:#fff;font-size:14px;font-weight:bold;text-decoration:none;text-align:center"><span class="mi" style="font-size:14px;vertical-align:middle;color:#fff">map</span> Google Maps\'te Yol Tarifi Al</a>';
}

// ================== NAKLİYECİ: KAPSAMA ALANI (GEOFENCE) ÇİZİMİ ==================
// Kullanıcı haritaya tıklayarak nokta nokta bir çokgen (vektörel alan) çizer.
var _geoMap = null;
var _geoPoints = [];
var _geoPolygon = null;
var _geoMarkers = [];

function initGeofenceMap(existingPointsJson){
  if(!document.getElementById('geoMapBox')) return;
  _geoPoints = [];
  if(existingPointsJson){
    try { _geoPoints = JSON.parse(existingPointsJson) || []; } catch(e){ _geoPoints = []; }
  }
  function startMap(){
    setTimeout(function(){
      if(_geoMap){ _geoMap.remove(); _geoMap = null; }
      _geoPolygon = null; _geoMarkers = [];
      _geoMap = L.map('geoMapBox',{zoomControl:true}).setView([39.0,35.0],6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'© OpenStreetMap',maxZoom:18
      }).addTo(_geoMap);
      _geoMap.on('click',function(e){
        _geoPoints.push([e.latlng.lat, e.latlng.lng]);
        redrawGeofence();
      });
      if(_geoPoints.length){
        redrawGeofence();
        var b = L.polygon(_geoPoints).getBounds();
        if(b.isValid()) _geoMap.fitBounds(b, {padding:[30,30]});
      } else if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(pos){
          _geoMap.setView([pos.coords.latitude,pos.coords.longitude],11);
        });
      }
    },150);
  }
  if(window.L){
    startMap();
  } else {
    if(!document.getElementById('lfcss')){
      var lc=document.createElement('link');
      lc.id='lfcss'; lc.rel='stylesheet';
      lc.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(lc);
    }
    var ls=document.createElement('script');
    ls.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    ls.onload=startMap;
    document.head.appendChild(ls);
  }
}
function redrawGeofence(){
  if(!_geoMap) return;
  _geoMarkers.forEach(function(m){ _geoMap.removeLayer(m); });
  _geoMarkers = [];
  if(_geoPolygon){ _geoMap.removeLayer(_geoPolygon); _geoPolygon = null; }
  _geoPoints.forEach(function(pt){
    var mk = L.circleMarker(pt, {radius:6, color:'#5C3408', fillColor:'#5C3408', fillOpacity:1}).addTo(_geoMap);
    _geoMarkers.push(mk);
  });
  if(_geoPoints.length >= 2){
    _geoPolygon = L.polygon(_geoPoints, {color:'#5C3408', weight:2, fillColor:'#5C3408', fillOpacity:0.15}).addTo(_geoMap);
  }
  var cnt = document.getElementById('geoPointCount');
  if(cnt) cnt.textContent = _geoPoints.length + ' nokta eklendi' + (_geoPoints.length > 0 && _geoPoints.length < 3 ? ' (en az 3 gerekli)' : '');
}
function clearGeofence(){
  _geoPoints = [];
  redrawGeofence();
}
function confirmGeofence(ctx){
  if(_geoPoints.length < 3){
    openErrorModal('Lütfen haritada en az 3 nokta işaretleyerek bir alan çizin.');
    return;
  }
  var geoJson = JSON.stringify(_geoPoints);
  if(ctx === 'editprofile'){
    currentProfile.kapsama_alani = geoJson;
    var uidG = currentProfile.firebase_uid;
    if(uidG){
      supabaseClient.from('profiles').update({kapsama_alani: geoJson}).eq('firebase_uid', uidG).then(function(res){
        if(res.error){ openErrorModal('Kapsama alanı kaydedilemedi.<br>'+res.error.message); return; }
        activeTab = 'nakliye_cagri';
        go('home');
      });
    }
  } else {
    regData.kapsamaAlani = geoJson;
    openNakliyeciBeyanPopup();
  }
}

// ================== NAKLİYECİ: BOŞ KM / İŞÇİLİK BEYANI ==================
// NOT: Metin şimdilik taslak — Burcu nihai metni verecek, o zaman değiştirilecek.
function openNakliyeciBeyanPopup(){
  var ov = document.createElement('div');
  ov.id = 'nakliyeciBeyanOv';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10000;padding:16px';
  ov.innerHTML =
    '<div style="background:#fff;border-radius:18px;max-width:310px;width:100%;display:flex;flex-direction:column;overflow:hidden;margin-bottom:28px">' +
      '<div style="background:#5C3408;padding:14px 18px;text-align:center">' +
        '<div style="font-size:14px;font-weight:bold;color:#fff"><span class="mi" style="font-size:14px;vertical-align:middle">assignment</span> Taahhüt Beyanı</div>' +
      '</div>' +
      '<div style="padding:18px;font-size:13px;color:#412402;background:#FDF3E7;line-height:1.7">' +
        'Kabul ettiğim yükün teslim noktasına kadar olan mesafeyi ve gerekli yükleme/boşaltma işçiliğini üstlendiğimi, dönüş yolunda boş (yüksüz) geçebileceğim mesafe için depom.app uygulamasından ayrıca bir ücret talep edemeyeceğimi beyan ederim. Verdiğim km fiyatı teklifinin bu şartları kapsadığını anlıyor ve kabul ediyorum. Taşıma sırasında oluşabilecek hasar ve gecikmelerden doğacak sorumluluğun tarafıma ait olduğunu biliyorum.' +
      '</div>' +
      '<div style="padding:14px 18px;background:#fff">' +
        '<label id="nakliyeciBeyanLabel" style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#C0000A;font-weight:bold;border:2px solid #C0000A;border-radius:10px;padding:12px;background:#FFF5F5;margin-bottom:12px">' +
          '<input type="checkbox" id="nakliyeciBeyanChk" style="margin-top:3px;accent-color:#C0000A;width:18px;height:18px;flex-shrink:0">' +
          '<span>Okudum, beyan ve taahhüt koşullarını kabul ediyorum.</span>' +
        '</label>' +
        '<button onclick="closeNakliyeciBeyanPopup()" style="width:100%;padding:14px;border-radius:12px;background:#5C3408;color:#fff;font-size:15px;font-weight:bold;border:none;cursor:pointer">Kabul Et ve Devam</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
}
function closeNakliyeciBeyanPopup(){
  var chk = document.getElementById('nakliyeciBeyanChk');
  if(!chk || !chk.checked){
    var lbl = document.getElementById('nakliyeciBeyanLabel');
    if(lbl){ lbl.style.animation='shake 0.3s'; setTimeout(function(){ lbl.style.animation=''; },300); }
    openErrorModal();
    return;
  }
  var ov = document.getElementById('nakliyeciBeyanOv');
  if(ov) ov.remove();
  saveProfileToSupabase('nakliyeci');
  openModal('nakliyeci');
}

function initMap(){
  if(!document.getElementById('mapBox')) return;
  function startMap(){
    setTimeout(function(){
      if(_map){ _map.remove(); _map=null; }
      _map = L.map('mapBox',{zoomControl:true}).setView([39.0,35.0],6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
        attribution:'© OpenStreetMap',maxZoom:18
      }).addTo(_map);
      _map.on('click',function(e){
        _selectedLat = e.latlng.lat.toFixed(5);
        _selectedLng = e.latlng.lng.toFixed(5);
        if(_mapMarker){ _map.removeLayer(_mapMarker); }
        _mapMarker = L.marker([_selectedLat,_selectedLng]).addTo(_map);
        _mapMarker.bindPopup('Konumunuz işaretlendi').openPopup();
        var cb = document.getElementById('coordBox');
        if(cb) cb.innerHTML = mi('location_on',12,'#3B6D11')+' '+_selectedLat+', '+_selectedLng;
        showNavLink(_selectedLat, _selectedLng);
      });
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(pos){
          _map.setView([pos.coords.latitude,pos.coords.longitude],13);
        });
      }
    },150);
  }
  if(window.L){
    startMap();
  } else {
    if(!document.getElementById('lfcss')){
      var lc=document.createElement('link');
      lc.id='lfcss'; lc.rel='stylesheet';
      lc.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(lc);
    }
    var ls=document.createElement('script');
    ls.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    ls.onload=startMap;
    document.head.appendChild(ls);
  }
}

startSloganRotator();
addBgDecor();
