name: Gunluk Hal Fiyatlari Scraper

on:
  schedule:
  - cron: '0 7 * * *'   # 10:00 TR
  - cron: '0 11 * * *'  # 14:00 TR
  workflow_dispatch:

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install requests beautifulsoup4 supabase

      - name: İstanbul (İBB) Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scrapers/ibb_scraper.py

      - name: İzmir Scraper
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scrapers/izmir_scraper.py
