name: Turkiye Ortalama Hal Fiyatlari - Gunluk Cekim

on:
  schedule:
    # Her gün TSİ 13:00'te çalışır (UTC 10:00 = TSİ 13:00, yaz saati)
    # İstanbul/İzmir'den 1 saat sonra — hal.gov.tr bülteni geç güncelleniyor,
    # erken çalıştırırsak dünün verisini bir kez daha çekmiş oluruz (zararsız
    # ama gereksiz), biraz geç çalıştırmak daha isabetli.
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # "Actions" sekmesinden elle de tetikleyebilirsin — İLK ÇALIŞTIRMAYI mutlaka böyle yap ve logu kontrol et

jobs:
  cek-ve-yaz:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4 lxml supabase

      - name: Türkiye ortalama verisini çek ve Supabase'e yaz
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scrapers/turkiye_ortalama_otomatik.py
